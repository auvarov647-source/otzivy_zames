<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Оцените пекарню-кофейню «Замес»</title>

<style>

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

  body { background: #2b1d16; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

  .card { background: #ffffff; max-width: 400px; width: 100%; border-radius: 26px; padding: 30px 22px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }

  .badge { display: inline-block; background: #fef3c7; color: #b45309; font-size: 12px; font-weight: bold; padding: 5px 12px; border-radius: 20px; margin-bottom: 14px; }

  .logo { width: 66px; height: 66px; background: #3e271c; color: #fff; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 14px; }

  h1 { font-size: 21px; font-weight: bold; color: #1c120d; margin-bottom: 6px; }

  .address { font-size: 13px; color: #8c786a; margin-bottom: 18px; }

  p.subtitle { font-size: 15px; color: #57463b; margin-bottom: 18px; line-height: 1.4; }

  .stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-direction: row-reverse; }

  .star { font-size: 44px; cursor: pointer; color: #e5e0d8; user-select: none; }

  .star:hover, .star:hover ~ .star, .star.active, .star.active ~ .star { color: #f59e0b; }

  .feedback-form { display: none; text-align: left; margin-top: 18px; padding-top: 16px; border-top: 1px solid #eee; }

  label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #2c1e16; }

  textarea, input { width: 100%; padding: 12px; background: #faf8f5; border: 1px solid #d6ccc2; border-radius: 12px; font-size: 15px; margin-bottom: 10px; }

  button { width: 100%; padding: 14px; background: #3e271c; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }

  .success-box { display: none; padding: 20px 0; }

  .success-box h2 { font-size: 20px; color: #059669; margin-bottom: 8px; }

</style>

</head>

<body>

<div class="card">

  <div id="mainStep">

    <div class="badge">Быстрый отзыв • 5 сек</div>
